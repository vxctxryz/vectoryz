# L0 alarm-stub keyword-strips per
# memory:alarm_stub_initial_keyword_strips_pragma
#
# Three clusters:
#   A — direct emergency-call requests
#   B — explicit life-threat (caller-as-victim)
#   C — child-caller medical-emergency (collapsed family-member)
#
# Cost-asymmetry: false-positive = strafzettel; false-negative = death.
# Bias toward dispatch.
#
# Extensible via doctrine-refinement. Add real-traffic patterns as they
# surface. Per operator-pragma: ML-tuning is later; keyword-stub is M1.

cluster_A_direct_emergency_call:
  EN:
    - "cops now"
    - "sos now"
    - "fire alarm here"
    - "killing just happen here"
    - "send police now"
    - "help me right now"
    - "call ambulance"
    - "emergency now"
