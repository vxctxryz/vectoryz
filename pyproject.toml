[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-wrapper"
version = "0.1.0"
description = "A minimal AI chat wrapper with verification + audit features. MIT-licensed; bring your own LLM engine and your own UI brand."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = [
    "ai",
    "chat",
    "llm",
    "wrapper",
    "fact-checking",
    "verification",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fasttext>=0.9.3",
    "cryptography>=42.0",
    "ddgs>=9.0",
    "PyYAML>=6.0",
    # stdlib-first design — most functionality uses stdlib
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wrapper_v2*"]
exclude = ["tests*", "examples*", "docs*", "build*"]
